name: Rolling packages

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.build.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Build the disposable beta packages
        id: build
        env:
          RUN_NUMBER: ${{ github.run_number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python -m pip install build
          # The same commit must build the same bytes on a retry.
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          python .github/scripts/build_distributions.py --outdir dist \
            --beta-run-number "$RUN_NUMBER" \
            --asset-base "https://github.com/$REPOSITORY/releases/download/beta"
          VERSION="$(python - <<'PY'
          import sys
          from pathlib import Path

          sys.path.insert(0, ".github/scripts")
          from build_distributions import metadata_of

          print(metadata_of(next(Path("dist").glob("ludex_games-*.whl")))["Version"])
          PY
          )"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Built beta package version $VERSION"

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages
          path: |
            dist/ludex.tar.gz
            dist/ludex-gui.tar.gz
            dist/*.whl
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  smoke:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages
          path: dist

      - name: Install build tools, uv and pipx
        run: python -m pip install build uv pipx

      - name: Verify the packages, then install them with uv and pipx
        working-directory: ${{ runner.temp }}
        env:
          PYTHONPATH: ""
        run: |
          python "$GITHUB_WORKSPACE/.github/scripts/smoke_distributions.py" \
            --mode beta --dist "$GITHUB_WORKSPACE/dist" --repository "${{ github.repository }}"

  publish:
    needs:
      - build
      - smoke
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: rolling-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      CHANNEL: beta
      PACKAGE_VERSION: ${{ needs.build.outputs.version }}
      SOURCE_SHA: ${{ github.sha }}
      SOURCE_BRANCH: ${{ github.ref_name }}
      REPOSITORY: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Check out triggering source for lease-checked tag update
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages
          path: dist

      - name: Update rolling GitHub Release
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path

          dist = Path("dist")
          sums = dict(line.split("  ", 1)[::-1] for line in (dist / "SHA256SUMS").read_text().splitlines())
          names = {p.name for p in dist.iterdir()} - {"SHA256SUMS"}
          wheels = {n for n in names if n.endswith(".whl")}
          prefixes = {"ludex_core-", "ludex_cli-", "ludex_tui-", "ludex_games-"}
          if set(sums) != names or {"ludex.tar.gz", "ludex-gui.tar.gz"} - names or len(wheels) != 4 or {w.split("-")[0] + "-" for w in wheels} != prefixes:
              raise SystemExit(f"package artifact set is incomplete or unexpected: {sorted(names)}")
          for name, digest in sums.items():
              if hashlib.sha256((dist / name).read_bytes()).hexdigest() != digest:
                  raise SystemExit(f"checksum mismatch: {name}")
          PY
          WHEELS=(dist/ludex_core-*.whl dist/ludex_cli-*.whl dist/ludex_tui-*.whl)
          BUNDLE_WHEEL=(dist/ludex_games-*.whl)

          BRANCH_HEAD="$(git ls-remote --heads origin "refs/heads/$SOURCE_BRANCH")"
          if [[ -z "$BRANCH_HEAD" ]]; then
            echo "Remote branch $SOURCE_BRANCH has no head" >&2
            exit 1
          fi
          if [[ "$(printf '%s\n' "$BRANCH_HEAD" | wc -l | tr -d ' ')" != "1" ]]; then
            echo "Could not resolve exactly one remote branch head for $SOURCE_BRANCH" >&2
            exit 1
          fi
          BRANCH_SHA="${BRANCH_HEAD%%[[:space:]]*}"
          if [[ "$BRANCH_SHA" != "$SOURCE_SHA" ]]; then
            {
              echo "Superseded run skipped: branch $SOURCE_BRANCH now points to $BRANCH_SHA, not $SOURCE_SHA."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          gh api --paginate --slurp "repos/$REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          RELEASES="$(jq -c --arg tag "$CHANNEL" '[.[][] | select(.tag_name == $tag)]' "$RUNNER_TEMP/releases.json")"
          RELEASE_COUNT="$(jq 'length' <<< "$RELEASES")"
          if [[ "$RELEASE_COUNT" -gt 1 ]]; then
            echo "Found more than one release tagged $CHANNEL" >&2
            exit 1
          fi
          if [[ "$RELEASE_COUNT" == "1" ]] && [[ "$(jq -r '.[0].immutable // false' <<< "$RELEASES")" == "true" ]]; then
            echo "Release $CHANNEL is immutable and cannot be rolled forward; no tag or asset was changed." >&2
            exit 1
          fi

          OLD_TAG="$(git ls-remote --refs origin "refs/tags/$CHANNEL")"
          if [[ -n "$OLD_TAG" ]]; then
            if [[ "$(printf '%s\n' "$OLD_TAG" | wc -l | tr -d ' ')" != "1" ]]; then
              echo "Could not resolve exactly one remote tag for $CHANNEL" >&2
              exit 1
            fi
            OLD_SHA="${OLD_TAG%%[[:space:]]*}"
          else
            OLD_SHA=""
          fi
          git push origin "--force-with-lease=refs/tags/$CHANNEL:$OLD_SHA" "$SOURCE_SHA:refs/tags/$CHANNEL"

          # Only the pre-release rolls; stable versions are tagged vX.Y.Z by pypi.yml and keep the Latest badge.
          TITLE="Rolling beta"
          PRERELEASE=true
          MAKE_LATEST=false
          BETA_URL="https://github.com/$REPOSITORY/releases/download/beta/ludex.tar.gz"
          NOTES="$(printf 'Rolling pre-release of `%s` at `%s`. For the latest stable version use `uv tool install ludex-games`.\n\nPackage version: `%s`\nWorkflow: %s\n\nWith uv: `uv tool install %s`\nWith pipx: `pipx install %s`\nWith the GUI: `uv tool install %s --with %s`' \
            "$SOURCE_BRANCH" "$SOURCE_SHA" "$PACKAGE_VERSION" "$RUN_URL" "$BETA_URL" "$BETA_URL" "$BETA_URL" "${BETA_URL%ludex.tar.gz}ludex-gui.tar.gz")"

          if [[ "$RELEASE_COUNT" == "0" ]]; then
            RELEASE_FLAGS=()
            if [[ "$MAKE_LATEST" == "true" ]]; then
              RELEASE_FLAGS+=(--latest)
            else
              RELEASE_FLAGS+=(--latest=false)
            fi
            if [[ "$PRERELEASE" == "true" ]]; then
              RELEASE_FLAGS+=(--prerelease)
            fi
            gh release create "$CHANNEL" dist/ludex.tar.gz dist/ludex-gui.tar.gz dist/SHA256SUMS dist/*.whl \
              --verify-tag --title "$TITLE" --notes "$NOTES" "${RELEASE_FLAGS[@]}"
          else
            RELEASE_ID="$(jq -r '.[0].id' <<< "$RELEASES")"

            # The previous manifest names the wheels the archive being replaced depends on. If it cannot be
            # read, nothing is pruned this time.
            mkdir -p "$RUNNER_TEMP/previous"
            PREVIOUS_WHEELS=""
            if gh release download "$CHANNEL" --pattern SHA256SUMS --dir "$RUNNER_TEMP/previous" --clobber 2>/dev/null; then
              PREVIOUS_WHEELS="$(awk '$2 ~ /\.whl$/ {print $2}' "$RUNNER_TEMP/previous/SHA256SUMS")"
            fi

            gh api --paginate "repos/$REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" --jq '.[].name' > "$RUNNER_TEMP/assets.txt"

            # A versioned wheel is never overwritten: an existing one must be byte-identical (a retry) or the run fails
            # before the rolling archive changes.
            upload_wheel() {
              local file="$1" name
              name="$(basename "$file")"
              if grep -qxF "$name" "$RUNNER_TEMP/assets.txt"; then
                mkdir -p "$RUNNER_TEMP/existing"
                gh release download "$CHANNEL" --pattern "$name" --dir "$RUNNER_TEMP/existing" --clobber
                if [[ "$(sha256sum "$RUNNER_TEMP/existing/$name" | cut -d' ' -f1)" != "$(sha256sum "$file" | cut -d' ' -f1)" ]]; then
                  echo "Release asset $name already exists with different contents; refusing to replace it" >&2
                  exit 1
                fi
              else
                gh release upload "$CHANNEL" "$file"
              fi
            }
            for wheel in "${WHEELS[@]}"; do upload_wheel "$wheel"; done
            gh release upload "$CHANNEL" dist/ludex.tar.gz dist/ludex-gui.tar.gz --clobber
            upload_wheel "${BUNDLE_WHEEL[0]}"
            gh release upload "$CHANNEL" dist/SHA256SUMS --clobber
            gh api --method PATCH "repos/$REPOSITORY/releases/$RELEASE_ID" \
              -f name="$TITLE" -f body="$NOTES" -F draft=false -F prerelease="$PRERELEASE" -f make_latest="$MAKE_LATEST" >/dev/null

            if [[ -n "$PREVIOUS_WHEELS" ]]; then
              KEEP="$(printf '%s\n' "$PREVIOUS_WHEELS"; awk '$2 ~ /\.whl$/ {print $2}' dist/SHA256SUMS)"
              gh api --paginate "repos/$REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" \
                | jq -r --arg keep "$KEEP" '($keep | split("\n")) as $k | .[] | select(.name | (startswith("ludex-") or startswith("ludex_")) and endswith(".whl")) | select(.name as $n | $k | index($n) | not) | .id' \
                | while IFS= read -r asset_id; do
                    [[ -n "$asset_id" ]] && gh api --method DELETE "repos/$REPOSITORY/releases/assets/$asset_id" >/dev/null
                  done
            fi
          fi

          {
            echo "## $TITLE"
            echo "- Branch: \`$SOURCE_BRANCH\`"
            echo "- Source: \`$SOURCE_SHA\`"
            echo "- Package: \`$PACKAGE_VERSION\`"
            echo "- Workflow: $RUN_URL"
            echo "- With uv: \`uv tool install $BETA_URL\`"
            echo "- With pipx: \`pipx install $BETA_URL\`"
          } >> "$GITHUB_STEP_SUMMARY"
