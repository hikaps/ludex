name: Rolling packages

on:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      channel: ${{ steps.version.outputs.channel }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Stamp the disposable package version
        id: version
        env:
          BRANCH: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          project_path = Path("pyproject.toml")
          init_path = Path("src/ludex/__init__.py")
          project = project_path.read_text()
          init = init_path.read_text()
          base = tomllib.loads(project)["project"]["version"]
          if not re.fullmatch(r"\d+\.\d+\.\d+", base):
              raise SystemExit(f"expected a plain numeric project version, got {base!r}")
          init_versions = re.findall(r'^__version__ = "([^"]+)"$', init, re.MULTILINE)
          if init_versions != [base]:
              raise SystemExit(f"package version {base!r} disagrees with __version__ assignments {init_versions!r}")

          branch = os.environ["BRANCH"]
          run_number = os.environ["RUN_NUMBER"]
          if branch == "develop":
              channel, version = "beta", f"{base}.dev{run_number}"
          elif branch == "main":
              channel, version = "stable", f"{base}.post{run_number}"
          else:
              raise SystemExit(f"unsupported release branch: {branch!r}")

          project, project_count = re.subn(
              r'(?m)^version = "' + re.escape(base) + r'"$',
              f'version = "{version}"', project,
          )
          init, init_count = re.subn(
              r'(?m)^__version__ = "' + re.escape(base) + r'"$',
              f'__version__ = "{version}"', init,
          )
          if project_count != 1 or init_count != 1:
              raise SystemExit(f"expected one version assignment per file, got {project_count} and {init_count}")
          project_path.write_text(project)
          init_path.write_text(init)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"channel={channel}\nversion={version}\n")
          print(f"Building {channel} package version {version}")
          PY

      - name: Build wheel and source distribution
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python -m pip install build
          python -m build --sdist --wheel --outdir dist
          python - <<'PY'
          import email
          import hashlib
          import os
          import shutil
          import tarfile
          import zipfile
          from pathlib import Path

          dist = Path("dist")
          sdists = list(dist.glob("*.tar.gz"))
          wheels = list(dist.glob("*.whl"))
          if len(sdists) != 1 or len(wheels) != 1:
              raise SystemExit(f"expected one sdist and one wheel; found {sdists!r}, {wheels!r}")
          expected = os.environ["EXPECTED_VERSION"]
          with zipfile.ZipFile(wheels[0]) as wheel:
              metadata_name = next(name for name in wheel.namelist() if name.endswith(".dist-info/METADATA"))
              wheel_metadata = email.message_from_bytes(wheel.read(metadata_name))
          with tarfile.open(sdists[0], "r:gz") as archive:
              metadata_member = next(member for member in archive.getmembers() if member.name.endswith("/PKG-INFO"))
              sdist_metadata = email.message_from_bytes(archive.extractfile(metadata_member).read())
          for kind, metadata in (("wheel", wheel_metadata), ("sdist", sdist_metadata)):
              if metadata.get("Name") != "ludex" or metadata.get("Version") != expected:
                  raise SystemExit(f"unexpected {kind} metadata: {metadata.get('Name')!r} {metadata.get('Version')!r}")
          archive = dist / "ludex.tar.gz"
          shutil.move(sdists[0], archive)
          files = [archive, wheels[0]]
          (dist / "SHA256SUMS").write_text("".join(
              f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}\n" for path in files
          ))
          PY
      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages
          path: |
            dist/ludex.tar.gz
            dist/*.whl
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  smoke:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages
          path: dist

      - name: Verify checksums
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path

          dist = Path("dist")
          entries = [line.split("  ", 1) for line in (dist / "SHA256SUMS").read_text().splitlines()]
          if len(entries) != 2:
              raise SystemExit(f"expected two package checksums, found {len(entries)}")
          for expected, name in entries:
              path = dist / name
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual != expected:
                  raise SystemExit(f"checksum mismatch: {name}")
          if not (dist / "ludex.tar.gz").is_file() or len(list(dist.glob("*.whl"))) != 1:
              raise SystemExit("package artifact set is incomplete")
          PY

      - name: Install uv and pipx
        run: python -m pip install uv pipx

      - name: Install each distribution and check its CLI
        env:
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
          PYTHONPATH: ""
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import shutil
          import subprocess
          import sys
          import tempfile
          import threading
          from functools import partial
          from http.server import SimpleHTTPRequestHandler, ThreadingHTTPServer
          from pathlib import Path

          assets = Path(os.environ["GITHUB_WORKSPACE"]) / "dist"
          scratch = Path(tempfile.mkdtemp(prefix="ludex-release-smoke-", dir="/tmp"))
          for name, value in {
              "UV_TOOL_DIR": scratch / "uv-tools",
              "UV_TOOL_BIN_DIR": scratch / "uv-bin",
              "UV_CACHE_DIR": scratch / "uv-cache",
              "PIPX_HOME": scratch / "pipx-home",
              "PIPX_BIN_DIR": scratch / "pipx-bin",
              "PIPX_MAN_DIR": scratch / "pipx-man",
          }.items():
              Path(value).mkdir(parents=True, exist_ok=True)
              os.environ[name] = str(value)
          os.environ.pop("PYTHONPATH", None)

          class QuietHandler(SimpleHTTPRequestHandler):
              def log_message(self, format, *args):
                  pass

          server = ThreadingHTTPServer(("127.0.0.1", 0), partial(QuietHandler, directory=str(assets)))
          thread = threading.Thread(target=server.serve_forever, daemon=True)
          thread.start()
          url = f"http://127.0.0.1:{server.server_port}/ludex.tar.gz"
          expected = f"ludex {os.environ['EXPECTED_VERSION']}"

          def call(args, *, env=None, timeout=120):
              result = subprocess.run(args, check=True, capture_output=True, text=True, env=env, timeout=timeout)
              return result.stdout.strip()

          def check_cli(binary, label):
              actual = call([str(binary), "--version"])
              if actual != expected:
                  raise AssertionError(f"{label}: expected {expected!r}, got {actual!r}")
              call([str(binary), "--help"])

          try:
              uv_install = [sys.executable, "-m", "uv", "tool", "install", "--python", sys.executable, url]
              call(uv_install)
              uv_cli = Path(os.environ["UV_TOOL_BIN_DIR"]) / "ludex"
              check_cli(uv_cli, "uv source install")
              call([sys.executable, "-m", "uv", "tool", "install", "--reinstall", "--python", sys.executable, url])
              check_cli(uv_cli, "uv source reinstall")

              pipx_install = [sys.executable, "-m", "pipx", "install", "--python", sys.executable, url]
              call(pipx_install)
              pipx_cli = Path(os.environ["PIPX_BIN_DIR"]) / "ludex"
              check_cli(pipx_cli, "pipx source install")
              call([sys.executable, "-m", "pipx", "install", "--force", "--pip-args=--no-cache-dir",
                    "--python", sys.executable, url])
              check_cli(pipx_cli, "pipx source reinstall")

              venv = scratch / "wheel-venv"
              subprocess.run([sys.executable, "-m", "venv", str(venv)], check=True, timeout=60)
              wheel = next(assets.glob("*.whl"))
              call([str(venv / "bin" / "python"), "-m", "pip", "install", str(wheel)], timeout=180)
              check_cli(venv / "bin" / "ludex", "wheel install")
          finally:
              server.shutdown()
              thread.join(timeout=10)
              server.server_close()
              shutil.rmtree(scratch, ignore_errors=True)
          PY

  publish:
    needs:
      - build
      - smoke
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: rolling-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      CHANNEL: ${{ needs.build.outputs.channel }}
      PACKAGE_VERSION: ${{ needs.build.outputs.version }}
      SOURCE_SHA: ${{ github.sha }}
      SOURCE_BRANCH: ${{ github.ref_name }}
      REPOSITORY: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Check out triggering source for lease-checked tag update
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages
          path: dist

      - name: Update rolling GitHub Release
        run: |
          set -euo pipefail
          WHEEL_NAME="$(python - <<'PY'
          import hashlib
          from pathlib import Path

          dist = Path("dist")
          entries = [line.split("  ", 1) for line in (dist / "SHA256SUMS").read_text().splitlines()]
          if len(entries) != 2:
              raise SystemExit("expected checksums for one source archive and one wheel")
          for expected, name in entries:
              if hashlib.sha256((dist / name).read_bytes()).hexdigest() != expected:
                  raise SystemExit(f"checksum mismatch: {name}")
          wheels = list(dist.glob("*.whl"))
          if not (dist / "ludex.tar.gz").is_file() or len(wheels) != 1:
              raise SystemExit("package artifact set is incomplete")
          print(wheels[0].name)
          PY
          )"

          BRANCH_HEAD="$(git ls-remote --heads origin "refs/heads/$SOURCE_BRANCH")"
          if [[ -z "$BRANCH_HEAD" ]]; then
            echo "Remote branch $SOURCE_BRANCH has no head" >&2
            exit 1
          fi
          if [[ "$(printf '%s\n' "$BRANCH_HEAD" | wc -l | tr -d ' ')" != "1" ]]; then
            echo "Could not resolve exactly one remote branch head for $SOURCE_BRANCH" >&2
            exit 1
          fi
          BRANCH_SHA="${BRANCH_HEAD%%[[:space:]]*}"
          if [[ "$BRANCH_SHA" != "$SOURCE_SHA" ]]; then
            {
              echo "Superseded run skipped: branch $SOURCE_BRANCH now points to $BRANCH_SHA, not $SOURCE_SHA."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          gh api --paginate --slurp "repos/$REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          RELEASES="$(jq -c --arg tag "$CHANNEL" '[.[][] | select(.tag_name == $tag)]' "$RUNNER_TEMP/releases.json")"
          RELEASE_COUNT="$(jq 'length' <<< "$RELEASES")"
          if [[ "$RELEASE_COUNT" -gt 1 ]]; then
            echo "Found more than one release tagged $CHANNEL" >&2
            exit 1
          fi
          if [[ "$RELEASE_COUNT" == "1" ]] && [[ "$(jq -r '.[0].immutable // false' <<< "$RELEASES")" == "true" ]]; then
            echo "Release $CHANNEL is immutable and cannot be rolled forward; no tag or asset was changed." >&2
            exit 1
          fi

          OLD_TAG="$(git ls-remote --refs origin "refs/tags/$CHANNEL")"
          if [[ -n "$OLD_TAG" ]]; then
            if [[ "$(printf '%s\n' "$OLD_TAG" | wc -l | tr -d ' ')" != "1" ]]; then
              echo "Could not resolve exactly one remote tag for $CHANNEL" >&2
              exit 1
            fi
            OLD_SHA="${OLD_TAG%%[[:space:]]*}"
          else
            OLD_SHA=""
          fi
          git push origin "--force-with-lease=refs/tags/$CHANNEL:$OLD_SHA" "$SOURCE_SHA:refs/tags/$CHANNEL"

          if [[ "$CHANNEL" == "beta" ]]; then
            TITLE="Rolling beta"
            PRERELEASE=true
            MAKE_LATEST=false
          else
            TITLE="Stable"
            PRERELEASE=false
            MAKE_LATEST=true
          fi
          BETA_URL="https://github.com/$REPOSITORY/releases/download/beta/ludex.tar.gz"
          STABLE_URL="https://github.com/$REPOSITORY/releases/download/stable/ludex.tar.gz"
          NOTES="$(printf 'Rolling %s package for `%s` at `%s`.\n\nPackage version: `%s`\nWorkflow: %s\n\nBeta with uv: `uv tool install %s`\nBeta with pipx: `pipx install %s`\nStable with uv: `uv tool install %s`\nStable with pipx: `pipx install %s`' \
            "$CHANNEL" "$SOURCE_BRANCH" "$SOURCE_SHA" "$PACKAGE_VERSION" "$RUN_URL" "$BETA_URL" "$BETA_URL" "$STABLE_URL" "$STABLE_URL")"

          if [[ "$RELEASE_COUNT" == "0" ]]; then
            RELEASE_FLAGS=()
            if [[ "$MAKE_LATEST" == "true" ]]; then
              RELEASE_FLAGS+=(--latest)
            else
              RELEASE_FLAGS+=(--latest=false)
            fi
            if [[ "$PRERELEASE" == "true" ]]; then
              RELEASE_FLAGS+=(--prerelease)
            fi
            gh release create "$CHANNEL" dist/ludex.tar.gz dist/SHA256SUMS "dist/$WHEEL_NAME" \
              --verify-tag --title "$TITLE" --notes "$NOTES" "${RELEASE_FLAGS[@]}"
          else
            RELEASE_ID="$(jq -r '.[0].id' <<< "$RELEASES")"
            gh release upload "$CHANNEL" dist/ludex.tar.gz dist/SHA256SUMS "dist/$WHEEL_NAME" --clobber
            gh api --method PATCH "repos/$REPOSITORY/releases/$RELEASE_ID" \
              -f name="$TITLE" -f body="$NOTES" -F draft=false -F prerelease="$PRERELEASE" -f make_latest="$MAKE_LATEST" >/dev/null
            gh api --paginate "repos/$REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" \
              | jq -r --arg wheel "$WHEEL_NAME" '.[] | select(.name | startswith("ludex-") and endswith(".whl")) | select(.name != $wheel) | .id' \
              | while IFS= read -r asset_id; do
                  [[ -n "$asset_id" ]] && gh api --method DELETE "repos/$REPOSITORY/releases/assets/$asset_id" >/dev/null
                done
          fi

          {
            echo "## $TITLE"
            echo "- Branch: \`$SOURCE_BRANCH\`"
            echo "- Source: \`$SOURCE_SHA\`"
            echo "- Package: \`$PACKAGE_VERSION\`"
            echo "- Workflow: $RUN_URL"
            echo "- Beta with uv: \`uv tool install $BETA_URL\`"
            echo "- Beta with pipx: \`pipx install $BETA_URL\`"
            echo "- Stable with uv: \`uv tool install $STABLE_URL\`"
            echo "- Stable with pipx: \`pipx install $STABLE_URL\`"
          } >> "$GITHUB_STEP_SUMMARY"
