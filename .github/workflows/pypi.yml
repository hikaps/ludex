name: PyPI

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and check only; do not publish, tag or release
        type: boolean
        default: false
  push:
    branches:
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.decide.outputs.version }}
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Verify versions and decide whether to release
        id: decide
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          VERSION="$(python - <<'PY'
          import os
          import sys

          sys.path.insert(0, ".github/scripts")
          from build_distributions import ROOT, check_tree

          base = check_tree(ROOT)
          if os.environ["REF_TYPE"] == "tag":
              tag = os.environ["REF_NAME"]
              if tag != f"v{base}":
                  raise SystemExit(f"tag {tag!r} does not match package version v{base}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={base}\n")
          print(base)
          PY
          )"

          # A version is released once: its tag exists, or this run creates it. A push to main that does not
          # change the version (anything but a release PR) therefore only builds and checks.
          if [[ "$REF_TYPE" == "tag" ]]; then
            PUBLISH=1 # the tag was just pushed; publish it
          elif [[ "$REF_NAME" == "main" ]]; then
            set +e
            git ls-remote --exit-code --refs origin "refs/tags/v$VERSION" >/dev/null 2>&1
            STATUS=$?
            set -e
            if [[ "$STATUS" == "0" ]]; then
              PUBLISH=0
              echo "v$VERSION is already tagged; nothing to publish." >> "$GITHUB_STEP_SUMMARY"
            elif [[ "$STATUS" == "2" ]]; then
              PUBLISH=1
            else
              echo "Could not check whether tag v$VERSION exists (git ls-remote exit $STATUS)" >&2
              exit 1
            fi
          else
            PUBLISH=0
            echo "Not on main or a version tag; build only." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ "${DRY_RUN:-false}" == "true" ]]; then
            PUBLISH=0
            echo "Dry run: nothing will be published, tagged or released." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ "$PUBLISH" == "1" ]] && ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            echo "CHANGELOG.md has no entry for $VERSION; add one before releasing" >&2
            exit 1
          fi
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"

      - name: Install Qt runtime libraries (the GUI smoke runs offscreen)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0

      - name: Build the five distributions and check them
        run: |
          set -euo pipefail
          python -m pip install build twine uv pipx
          python .github/scripts/build_distributions.py --outdir dist
          python -m twine check --strict dist/*

      - name: Smoke-install the built distributions
        working-directory: ${{ runner.temp }}
        env:
          PYTHONPATH: ""
        run: python "$GITHUB_WORKSPACE/.github/scripts/smoke_distributions.py" --mode stable --dist "$GITHUB_WORKSPACE/dist"

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # Each project publishes from its own GitHub environment: PyPI allows one pending publisher per repository,
  # workflow and environment, so new projects cannot share one. Dependencies go first, so the bundle is never
  # installable before the packages it pins exist; a failure stops the later jobs and the tag.
  publish-core:
    needs: build
    if: needs.build.outputs.publish == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Select the ludex-core files
        run: |
          set -euo pipefail
          mkdir publish
          cp dist/ludex_core-* publish/
          [[ "$(ls publish | wc -l | tr -d ' ')" == "2" ]] || { echo "expected a wheel and an sdist for ludex-core" >&2; exit 1; }

      - name: Publish ludex-core to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: publish/
          skip-existing: true # a re-run after a failed later job must not fail on the upload

  publish-cli:
    needs: [build, publish-core]
    if: needs.build.outputs.publish == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pypi-cli
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Select the ludex-cli files
        run: |
          set -euo pipefail
          mkdir publish
          cp dist/ludex_cli-* publish/
          [[ "$(ls publish | wc -l | tr -d ' ')" == "2" ]] || { echo "expected a wheel and an sdist for ludex-cli" >&2; exit 1; }

      - name: Publish ludex-cli to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: publish/
          skip-existing: true # a re-run after a failed later job must not fail on the upload

  publish:
    needs: [build, publish-cli]
    if: needs.build.outputs.publish == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
      contents: write # to create the tag and the GitHub Release after publishing
    steps:
      - name: Check out the changelog
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Select the ludex-games files
        run: |
          set -euo pipefail
          mkdir publish
          cp dist/ludex_games-* publish/
          [[ "$(ls publish | wc -l | tr -d ' ')" == "2" ]] || { echo "expected a wheel and an sdist for ludex-games" >&2; exit 1; }

      - name: Publish ludex-games to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: publish/
          skip-existing: true

      - name: Tag the version and create its release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if ! gh api "repos/$GH_REPO/git/ref/tags/$tag" >/dev/null 2>&1; then
            gh api --method POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$tag" -f sha="$SHA" >/dev/null
            echo "Created tag $tag at $SHA." >> "$GITHUB_STEP_SUMMARY"
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            # Notes are this version's CHANGELOG section plus a link to the full diff; not a commit list.
            python3 - "$VERSION" > notes.md <<'PY'
          import re
          import sys

          version = sys.argv[1]
          text = open("CHANGELOG.md").read()
          match = re.search(r"^## \[" + re.escape(version) + r"\][^\n]*\n(.*?)(?=^## \[|\Z)", text, re.S | re.M)
          if not match or not match.group(1).strip():
              raise SystemExit(f"CHANGELOG.md has no entry for {version}; add one before releasing")
          print(match.group(1).strip())
          PY
            prev="$(gh api "repos/$GH_REPO/git/matching-refs/tags/v" --jq '.[].ref | ltrimstr("refs/tags/")' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -vx "$tag" | sort -V | tail -n 1 || true)"
            if [[ -n "$prev" ]]; then
              printf '\n**Full changelog**: https://github.com/%s/compare/%s...%s\n' "$GH_REPO" "$prev" "$tag" >> notes.md
            else
              printf '\n**Full changelog**: https://github.com/%s/blob/%s/CHANGELOG.md\n' "$GH_REPO" "$tag" >> notes.md
            fi
            gh release create "$tag" dist/* --verify-tag --title "$tag" --notes-file notes.md --latest
            echo "Created the release for $tag." >> "$GITHUB_STEP_SUMMARY"
          fi

  # ludex-gui is not part of the ludex-games bundle, so nothing pins it and the tag does not wait for it. It goes last: a
  # missing PyPI publisher or a failure here leaves the release (and the other four projects) intact, and a re-run skips
  # files PyPI already has.
  publish-gui:
    needs: [build, publish]
    if: needs.build.outputs.publish == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pypi-gui
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Select the ludex-gui files
        run: |
          set -euo pipefail
          mkdir publish
          cp dist/ludex_gui-* publish/
          [[ "$(ls publish | wc -l | tr -d ' ')" == "2" ]] || { echo "expected a wheel and an sdist for ludex-gui" >&2; exit 1; }

      - name: Publish ludex-gui to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: publish/
          skip-existing: true
