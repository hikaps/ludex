[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ludex-tui"
version = "0.61.0"
description = "Terminal UI frontend of ludex"
readme = { text = "The Textual terminal UI of [ludex](https://github.com/hikaps/ludex). Install `ludex-games` for the `ludex` command plus the UI.", content-type = "text/markdown" }
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["ludex-core==0.61.0", "rich>=14.2.0", "textual==8.2.8"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment",
]

[project.urls]
Homepage = "https://hikaps.github.io/ludex/"
Repository = "https://github.com/hikaps/ludex"
Issues = "https://github.com/hikaps/ludex/issues"
Changelog = "https://github.com/hikaps/ludex/blob/main/CHANGELOG.md"

[project.scripts]
ludex-tui = "ludex_tui.app:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ludex_tui*"]

[tool.uv.sources]
ludex-core = { workspace = true }
