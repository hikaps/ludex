[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ludex-gui"
version = "0.65.0"
description = "Desktop and console-mode game launcher (Qt Quick) for ludex, drivable with a game controller"
readme = { text = "The Qt Quick game launcher of [ludex](https://github.com/hikaps/ludex). Not part of `ludex-games`: install it next to it (`ludex gui`) or on its own (`ludex-gui`).", content-type = "text/markdown" }
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["ludex-core==0.65.0", "PySide6-Essentials==6.12.0"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment",
]

[project.optional-dependencies]
gamepad = ["PySDL2==0.9.17", "pysdl2-dll==2.32.10"]

[project.urls]
Homepage = "https://hikaps.github.io/ludex/"
Repository = "https://github.com/hikaps/ludex"
Issues = "https://github.com/hikaps/ludex/issues"
Changelog = "https://github.com/hikaps/ludex/blob/main/CHANGELOG.md"

[project.scripts]
ludex-gui = "ludex_gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ludex_gui*"]

[tool.setuptools.package-data]
ludex_gui = ["qml/*", "assets/*"]

[tool.uv.sources]
ludex-core = { workspace = true }
