[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ludex-games"
version = "0.63.0"
description = "Every game you own, in one local library: scriptable CLI, TUI and a controller-friendly launcher"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["ludex-core==0.63.0", "ludex-cli==0.63.0", "ludex-tui==0.63.0"]
keywords = ["game-library", "steam", "epic-games", "gog", "linux-gaming", "cli", "tui", "gui", "gamepad", "plugins", "sqlite"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment",
]

[project.urls]
Homepage = "https://hikaps.github.io/ludex/"
Repository = "https://github.com/hikaps/ludex"
Issues = "https://github.com/hikaps/ludex/issues"
Changelog = "https://github.com/hikaps/ludex/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[project.scripts]
ludex = "ludex_cli.cli:main"

[tool.setuptools]
packages = []

[tool.uv.workspace]
members = ["packages/core", "packages/cli", "packages/tui", "packages/gui"]

[tool.uv.sources]
ludex-core = { workspace = true }
ludex-cli = { workspace = true }
ludex-tui = { workspace = true }
ludex-gui = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
