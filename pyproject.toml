[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ludex"
version = "0.7.0"
description = "Headless, scriptable library of the games you own across stores"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["httpx==0.28.1", "vdf==3.4"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[project.scripts]
ludex = "ludex.cli:main"

[project.entry-points."ludex.ownership"]
steam = "ludex.sources.steam:PLUGIN"
epic = "ludex.sources.epic:PLUGIN"
local = "ludex.sources.local:PLUGIN"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
